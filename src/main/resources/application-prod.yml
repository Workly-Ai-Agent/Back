spring:
  application:
    name: hp657
  datasource:
    url: ${SPRING_DATASOURCE_URL}             # 배포 플랫폼이 채워줄 공간
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}   # 배포 플랫폼이 채워줄 공간
    password: ${SPRING_DATASOURCE_PASSWORD}   # 배포 플랫폼이 채워줄 공간
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: "workly-dev-secret-key-change-me-in-production"
  expiration-ms: 900000
  refresh-expiration-ms: 1209600000
  cookie-secure: false

server:
  port: 8080
