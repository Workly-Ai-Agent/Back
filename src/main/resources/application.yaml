spring:
  application:
    name: hp657
  datasource:
    url: jdbc:h2:mem:workly;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: "workly-dev-secret-key-change-me-in-production"
  expiration-ms: 900000
  refresh-expiration-ms: 1209600000
  cookie-secure: false

server:
  port: 8080
